name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Config Git User
        run: |
          git config --local user.name "dragooncjw"
          git config --local user.email "289056872@qq.com"
      - name: For Debug
        run: |
          echo "Listing files in the root directory:"
          ls -alh
      - uses: actions/setup-node@v3
        with:
          node-version: 18.20.3
      - name: Debug Info
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "pnpm version: $(pnpm --version)"
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Rush build
        run: node common/scripts/install-run-rush.js build
      - name: Print build failures
        if: failure()
        run: |
          echo "=== Failed projects ==="
          find . -name "rush-build-error.log" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true
          echo ""
          echo "=== Looking for build output files with errors ==="
          find common/temp -name "*.log" -path "*/build/*" -mmin -10 2>/dev/null | head -20 || true
      - name: Check Lint
        run: node common/scripts/install-run-rush.js lint --verbose
      - name: Check TS
        run: node common/scripts/install-run-rush.js ts-check
      - name: Test (coverage)
        run: node common/scripts/install-run-rush.js test:cov
